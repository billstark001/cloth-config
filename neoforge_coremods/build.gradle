dependencies {
    implementation("net.neoforged.fancymodloader:loader:10.0.34") { transitive = false }
    implementation("org.ow2.asm:asm:9.8")
    implementation("org.ow2.asm:asm-tree:9.8")
}

jar {
    manifest {
        attributes "Automatic-Module-Name": "shedaniel.cloth_config.coremods"
        attributes "FMLModType": "LIBRARY"
    }
    
    archiveFileName.set("${rootProject.archives_base_name}-coremods-${rootProject.version}.jar")
}
